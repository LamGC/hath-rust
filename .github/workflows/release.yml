name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Validate:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag, Cargo versions and changelog
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release.py check --tag "$RELEASE_TAG"
      - name: Verify signed tag and pinned primary fingerprint
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://github.com/LamGC.gpg --output "$RUNNER_TEMP/release-public-key.asc"
          gpg --batch --import "$RUNNER_TEMP/release-public-key.asc"
          git verify-tag --raw "$RELEASE_TAG" 2> "$RUNNER_TEMP/tag-verification.txt"
          python3 .github/scripts/release.py verify-tag --status "$RUNNER_TEMP/tag-verification.txt"
      - name: Test release validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
  Test:
    needs: Validate
    uses: ./.github/workflows/manager-integration.yml
  Build:
    needs: Validate
    uses: ./.github/workflows/build.yml
  Release:
    needs: [Validate, Test, Build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: hath-rust-*
          path: artifacts
      - name: Prepare checked binaries, manifest and offline descriptor
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release.py prepare --tag "$RELEASE_TAG" --artifacts artifacts --destination dist --notes "$RUNNER_TEMP/release-notes.md"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ needs.Validate.outputs.prerelease == 'true' }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: dist/*
